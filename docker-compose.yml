services:
  db:
    image: postgres:16-alpine
    container_name: talentbridge-db
    environment:
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge
      POSTGRES_DB: talentbridge
    ports:
      # 5435 avoids clashes on shared hosts (5433/5434 often used by other projects)
      - "127.0.0.1:5435:5432"
    volumes:
      - talentbridge_pg:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentbridge -d talentbridge"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  talentbridge_pg:
